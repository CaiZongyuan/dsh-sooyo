<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>sooyo daily</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one centred 1440px frame. Command bar on top, a greeting headline, then a packed
   bento grid of Widgets (12 / 6 / 4 columns by frame width). Grey page, white cards, ink type;
   colour lives in the icons and in a single low-saturation blue-violet for interaction. */
:root {
  --bg: #F3F4F6;
  --card: #FFFFFF;
  --well: #F5F6F8;
  --line: rgba(20, 22, 30, .07);
  --line-2: rgba(20, 22, 30, .13);
  --ink: #15171C;
  --ink-2: #5A5F69;
  --ink-3: #9CA1AB;
  --accent: #6A6FCF;
  --accent-soft: rgba(106, 111, 207, .10);
  --accent-ink: #4A4FAE;
  --coral: #E05A46;
  --ok: #3A9A68;
  --warn: #C08326;
  --bad: #CC4C42;
  --on-photo: #FFFFFF;
  --sky-1: #6D8DB4;
  --sky-2: #2F4868;
  --sw-1: #93A8F0;
  --sw-2: #C9A6EE;
  --plate: transparent;
  --skel: rgba(20, 22, 30, .06);
  --scrim: rgba(14, 15, 18, .34);
  --shadow: 0 1px 2px rgba(16, 18, 24, .04), 0 10px 28px -16px rgba(16, 18, 24, .14);
  --shadow-hover: 0 2px 4px rgba(16, 18, 24, .05), 0 16px 36px -16px rgba(16, 18, 24, .20);
  --shadow-lift: 0 4px 10px rgba(16, 18, 24, .08), 0 28px 56px -18px rgba(16, 18, 24, .30);
  --t-task: #6F74D3; --t-subscription: #D98A4C; --t-calendar: #E05A46; --t-capture: #9A86CC;
  --t-bookmarks: #4A9895; --t-project: #66966B; --t-readlater: #CC9632; --t-habit: #D27690;
  --t-focus: #C3654A; --t-weather: #5E9FD3; --t-briefing: #B8963A; --t-embed: #6C7C93;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --row: 88px;
  --gap: 14px;
  --radius: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E0F12; --card: #18191D; --well: #212227; --line: rgba(255, 255, 255, .07); --line-2: rgba(255, 255, 255, .13);
    --ink: #F1F2F4; --ink-2: #A5A9B2; --ink-3: #6D727C; --accent: #9C9FF2; --accent-soft: rgba(156, 159, 242, .14); --accent-ink: #BABCF7;
    --coral: #F07A66; --ok: #5DBB8A; --warn: #DDA24A; --bad: #EE7066; --sky-1: #4E6C93; --sky-2: #1D2F47;
    --plate: rgba(255, 255, 255, .07); --skel: rgba(255, 255, 255, .06); --scrim: rgba(0, 0, 0, .55);
    --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 10px 28px -16px rgba(0, 0, 0, .7);
    --shadow-hover: 0 2px 4px rgba(0, 0, 0, .4), 0 16px 36px -16px rgba(0, 0, 0, .8);
    --shadow-lift: 0 4px 10px rgba(0, 0, 0, .45), 0 28px 56px -18px rgba(0, 0, 0, .9);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E0F12; --card: #18191D; --well: #212227; --line: rgba(255, 255, 255, .07); --line-2: rgba(255, 255, 255, .13);
  --ink: #F1F2F4; --ink-2: #A5A9B2; --ink-3: #6D727C; --accent: #9C9FF2; --accent-soft: rgba(156, 159, 242, .14); --accent-ink: #BABCF7;
  --coral: #F07A66; --ok: #5DBB8A; --warn: #DDA24A; --bad: #EE7066; --sky-1: #4E6C93; --sky-2: #1D2F47;
  --plate: rgba(255, 255, 255, .07); --skel: rgba(255, 255, 255, .06); --scrim: rgba(0, 0, 0, .55);
  --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 10px 28px -16px rgba(0, 0, 0, .7);
  --shadow-hover: 0 2px 4px rgba(0, 0, 0, .4), 0 16px 36px -16px rgba(0, 0, 0, .8);
  --shadow-lift: 0 4px 10px rgba(0, 0, 0, .45), 0 28px 56px -18px rgba(0, 0, 0, .9);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
svg { display: block; flex: none; }
.c1, .c2, .c3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; }
.c1 { -webkit-line-clamp: 1; } .c2 { -webkit-line-clamp: 2; } .c3 { -webkit-line-clamp: 3; }
.grow { flex: 1; min-width: 0; }
.meta { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.mono { font-family: var(--mono); }

/* ---- page frame ---- */
.page { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 96px; }
.frame { max-width: 1440px; margin: 0 auto; container: app / inline-size; }
.frame.preview { max-width: var(--pw); margin-top: 20px; padding: 0 16px 28px; border: 1px solid var(--line-2); border-radius: 30px; box-shadow: var(--shadow); }
.shell { display: flex; gap: 20px; align-items: flex-start; }
.main { flex: 1; min-width: 0; }
.rail { display: none; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 14px); flex: 0 0 56px; flex-direction: column; align-items: center; gap: 6px; padding: 10px 0; margin-top: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); }
.rail button { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 12px; color: var(--ink-3); position: relative; }
.rail button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-ink); }
.rail button:hover { color: var(--ink); }
.rail .rail-sep { width: 24px; height: 1px; background: var(--line-2); margin: 4px 0; }
.frame.rail-on .rail { display: flex; }
.frame.rail-on .seg-boards { display: none; }
@container app (max-width: 720px) {
  .frame.rail-on .rail { display: none; }
  .frame.rail-on .seg-boards { display: flex; }
}

/* ---- top bar ---- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 14px; padding-block: 14px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px); }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 650; font-size: 17px; letter-spacing: -.02em; white-space: nowrap; }
.brand i { width: 22px; height: 22px; border-radius: 7px; background: conic-gradient(from 210deg, var(--sw-1), var(--sw-2), var(--sw-1)); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .5); }
.brand span { color: var(--ink-3); font-weight: 500; }
.seg { display: flex; padding: 3px; background: var(--well); border: 1px solid var(--line); border-radius: 12px; gap: 2px; min-width: 0; }
.seg button { padding: 6px 12px; border-radius: 9px; color: var(--ink-2); font-weight: 500; white-space: nowrap; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(16, 18, 24, .08), 0 0 0 1px var(--line); }
.seg .seg-add { color: var(--ink-3); padding: 6px 9px; }
.cmd { position: relative; flex: 1; min-width: 0; max-width: 560px; margin-inline: auto; }
.cmd-box { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 5px 0 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); color: var(--ink-3); }
.cmd-box:focus-within { border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
.cmd-box input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--ink); }
.cmd-box input::placeholder { color: var(--ink-3); }
kbd { font: 500 11px/1 var(--mono); color: var(--ink-3); border: 1px solid var(--line-2); border-radius: 6px; padding: 3px 6px; white-space: nowrap; }
.agent-btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px 0 6px; border-radius: 9px; background: var(--well); color: var(--ink); font-size: 13px; font-weight: 500; white-space: nowrap; }
.agent-btn:hover { background: var(--accent-soft); }
.cmd-pop { position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 40; background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-lift); padding: 6px; max-height: min(440px, 62vh); overflow: auto; }
.cmd-group { font: 500 11px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); padding: 10px 10px 6px; }
.cmd-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border-radius: 9px; text-align: left; min-width: 0; }
.cmd-item[aria-selected="true"] { background: var(--accent-soft); }
.cmd-item .k { font: 500 11px/1 var(--mono); color: var(--ink-2); background: var(--well); border-radius: 6px; padding: 4px 6px; flex: none; }
.cmd-item .ci-t { flex: 1; min-width: 0; }
.cmd-item .ci-t b { font-weight: 600; }
.cmd-empty { padding: 14px 10px; color: var(--ink-3); font-size: 13px; }
.actions { display: flex; align-items: center; gap: 8px; }
.btn { height: 36px; padding: 0 14px; border-radius: 11px; border: 1px solid var(--line-2); background: var(--card); font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
.btn:hover { border-color: var(--ink-3); }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
.btn-ink { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn-ink:hover { border-color: var(--ink); opacity: .9; }
.btn-wide { height: 52px; border-radius: 14px; font-size: 15px; color: var(--ink-3); width: 100%; }
.btn-wide b { color: var(--ink); font-weight: 500; }
.icon-btn { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; border: 1px solid var(--line-2); background: var(--card); color: var(--ink-2); flex: none; }
.icon-btn:hover { color: var(--ink); border-color: var(--ink-3); }
.switch { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 4px 0 10px; border-radius: 11px; font-weight: 500; color: var(--ink-2); white-space: nowrap; }
.switch:hover { color: var(--ink); }
.sw { width: 46px; height: 28px; border-radius: 99px; background: var(--well); border: 1px solid var(--line-2); position: relative; transition: background .25s; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; border-radius: 50%; background: var(--card); box-shadow: 0 2px 6px rgba(16, 18, 24, .22); transition: transform .25s cubic-bezier(.3, .7, .2, 1); }
.switch[aria-checked="true"] { color: var(--ink); }
.switch[aria-checked="true"] .sw { background: linear-gradient(90deg, var(--sw-1), var(--sw-2)); border-color: transparent; }
.switch[aria-checked="true"] .sw::after { transform: translateX(18px); background: #FFFFFF; }
@container app (max-width: 1080px) {
  .topbar { flex-wrap: wrap; row-gap: 10px; }
  .cmd { order: 5; flex-basis: 100%; max-width: none; }
  .actions { margin-left: auto; }
}
@container app (max-width: 640px) {
  .seg-boards { order: 6; flex-basis: 100%; overflow-x: auto; scrollbar-width: none; }
  .seg-boards button { flex: 1; }
  .btn-add .lbl, .switch .lbl { display: none; }
  .btn-add { width: 36px; padding: 0; }
  .agent-btn .lbl { display: none; }
  .cmd-box kbd { display: none; }
}

/* ---- hero ---- */
.hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; padding-block: 30px 24px; }
.tag { display: inline-block; font: 500 11px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; border: 1px solid var(--ink-2); color: var(--ink); border-radius: 5px; padding: 4px 6px; margin-bottom: 18px; }
.headline { margin: 0; font-size: clamp(26px, 3.1cqi, 44px); line-height: 1.2; letter-spacing: -.028em; font-weight: 500; color: var(--ink-3); max-width: 23em; text-wrap: balance; }
.headline b { color: var(--ink); font-weight: 500; }
.hi { display: inline-block; width: 1.18em; height: 1.18em; vertical-align: -.24em; margin: 0 .04em 0 .02em; filter: drop-shadow(0 6px 10px rgba(16, 18, 24, .16)); transform: rotate(-7deg); }
.hi.r { transform: rotate(6deg); }
.nw { white-space: nowrap; }
.status { display: flex; align-items: center; gap: 8px; font: 12px var(--mono); color: var(--ink-2); white-space: nowrap; padding-bottom: 6px; }
.status i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 18%, transparent); }
@container app (max-width: 720px) {
  .hero { flex-direction: column; align-items: flex-start; gap: 14px; padding-block: 18px 18px; }
  .headline { font-size: 26px; }
}
.editbar { display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 14px; border-radius: 14px; background: var(--accent-soft); color: var(--accent-ink); margin-bottom: 14px; font-size: 13px; }
.editbar .grow { min-width: 0; }

/* ---- grid + cards ---- */
.grid { display: grid; grid-template-columns: repeat(var(--cols, 12), minmax(0, 1fr)); grid-auto-rows: var(--row); gap: var(--gap); position: relative; }
@container app (max-width: 640px) { .grid { --gap: 12px; } }
.w { position: relative; display: flex; flex-direction: column; min-width: 0; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; overflow: hidden; transition: box-shadow .2s ease; }
.w:hover { box-shadow: var(--shadow-hover); }
.w-h { display: flex; align-items: center; gap: 8px; height: 26px; margin-bottom: 10px; flex: none; min-width: 0; }
.w-t { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 8px; white-space: nowrap; overflow: hidden; }
.w-t b { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.w-t span { font-size: 12px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; }
.w-m { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; color: var(--ink-3); opacity: 0; transition: opacity .15s; flex: none; }
.w:hover .w-m, .w:focus-within .w-m, .w-m[aria-expanded="true"] { opacity: 1; }
.w-m:hover { background: var(--well); color: var(--ink); }
.w-m.abs { position: absolute; top: 10px; right: 10px; z-index: 3; }
@media (hover: none) { .w-m { opacity: .7; } }
.w-b { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; position: relative; z-index: 1; }
.w--s .w-b { gap: 0; justify-content: space-between; }
.ic { display: inline-grid; place-items: center; width: var(--s, 22px); height: var(--s, 22px); border-radius: 28%; background: var(--plate); flex: none; }
.ic img { width: 100%; height: 100%; object-fit: contain; }
.ic[data-fallback] { background: color-mix(in srgb, var(--ic-c, var(--accent)) 22%, var(--card)); }
.deco { position: absolute; inset: 0; overflow: hidden; pointer-events: none; border-radius: inherit; z-index: 0; }
.deco img { position: absolute; right: -16px; bottom: -20px; width: 116px; height: 116px; transform: rotate(-8deg); filter: drop-shadow(0 10px 18px rgba(16, 18, 24, .16)); }
.flash { animation: flash 1.2s ease; }
@keyframes flash { 0%, 100% { box-shadow: var(--shadow); } 30% { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 50%, transparent), var(--shadow-hover); } }

/* S layout */
.s-lab { font-size: 12px; font-weight: 500; color: var(--ink-2); display: flex; align-items: center; gap: 6px; padding-right: 28px; white-space: nowrap; overflow: hidden; }
.s-main { display: flex; flex-direction: column; }
.s-big { font-size: 52px; font-weight: 300; line-height: 1; letter-spacing: -.045em; font-variant-numeric: tabular-nums; }
.s-big small { font-size: 22px; color: var(--ink-3); letter-spacing: 0; margin-left: 3px; font-weight: 400; }
.s-sub { font-size: 13px; color: var(--ink-2); margin-top: 6px; }
.s-narrow { max-width: 64%; }
.s-next { display: flex; align-items: center; gap: 8px; max-width: 70%; text-align: left; font-size: 13px; color: var(--ink-2); }
.s-title { font-size: 16px; font-weight: 600; line-height: 1.32; letter-spacing: -.01em; }

/* rows */
.list { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.fit { flex: 1; min-height: 0; overflow: hidden; }
.fit-x { display: flex; gap: 12px; overflow: hidden; flex: 1; min-height: 0; }
.row { position: relative; display: flex; align-items: center; gap: 10px; min-height: 36px; padding: 5px 8px; margin-inline: -8px; border-radius: 10px; min-width: 0; flex: none; }
.row:hover { background: var(--well); }
.row .tt { font-size: 13.5px; font-weight: 500; }
.it-a { display: flex; flex-direction: column; gap: 1px; min-width: 0; flex: 1; }
.chk { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--ink-3); display: grid; place-items: center; flex: none; color: transparent; transition: background .15s, border-color .15s; }
.chk:hover { border-color: var(--accent); }
.done .chk, .chk.on { background: var(--accent); border-color: var(--accent); color: var(--card); }
.done .tt, .done .t-title { color: var(--ink-3); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--ink-3) 60%, transparent); }
.t-title { font-size: 13.5px; }
.t-m { min-height: 52px; align-items: flex-start; padding-top: 9px; }
.t-m .chk { margin-top: 1px; }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border-radius: 99px; background: var(--well); color: var(--ink-2); font-size: 11px; white-space: nowrap; flex: none; max-width: 40%; overflow: hidden; text-overflow: ellipsis; }
a.chip:hover { color: var(--accent-ink); background: var(--accent-soft); }
.chip-score { background: color-mix(in srgb, var(--t-subscription) 14%, var(--card)); color: color-mix(in srgb, var(--t-subscription) 70%, var(--ink)); }
.acts { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); display: none; gap: 4px; z-index: 2; }
.row:hover .acts, .row:focus-within .acts, .lead:hover .acts, .tile:hover .acts { display: flex; }
.acts button, .acts a { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 8px; background: var(--card); border: 1px solid var(--line-2); color: var(--ink-2); box-shadow: var(--shadow); }
.acts button:hover, .acts a:hover { color: var(--accent-ink); }
.acts [aria-pressed="true"] { color: var(--accent-ink); background: var(--accent-soft); }
.mini { height: 24px; padding: 0 8px; border-radius: 7px; font-size: 12px; color: var(--ink-2); background: var(--card); border: 1px solid var(--line-2); flex: none; white-space: nowrap; }
.mini:hover { color: var(--accent-ink); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
.bar { height: 6px; border-radius: 3px; background: var(--well); overflow: hidden; flex: none; }
.bar i { display: block; height: 100%; border-radius: 3px; background: var(--c, var(--accent)); transition: width .4s ease; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; column-gap: 20px; row-gap: 6px; min-height: 0; flex: 1; align-content: start; overflow: hidden; }
.grid2.r3 { grid-template-rows: repeat(3, auto); grid-auto-flow: column; row-gap: 0; }

/* subscription */
.rk-n { width: 22px; font-size: 19px; font-weight: 300; color: var(--ink-3); font-variant-numeric: tabular-nums; text-align: right; flex: none; letter-spacing: -.03em; }
.rk-n.top { color: var(--ink); }
.rk-row { min-height: 32px; }
.rk-row .tt { font-weight: 450; }
.thumb { border-radius: 9px; overflow: hidden; background: var(--well); flex: none; position: relative; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.gen { display: grid; place-items: center; width: 100%; height: 100%; background: linear-gradient(140deg, color-mix(in srgb, var(--c) 30%, var(--card)), color-mix(in srgb, var(--c) 8%, var(--card))); color: color-mix(in srgb, var(--c) 75%, var(--ink)); font: 600 13px/1.2 var(--font); text-align: center; padding: 6px; }
.gen.big { font-size: 30px; font-weight: 300; }
.play { position: absolute; inset: 0; display: grid; place-items: center; }
.play span { width: 26px; height: 26px; border-radius: 50%; background: rgba(10, 12, 16, .55); color: var(--on-photo); display: grid; place-items: center; backdrop-filter: blur(4px); }
.mono-t { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-weight: 650; font-size: 15px; background: color-mix(in srgb, var(--c) 16%, var(--card)); color: color-mix(in srgb, var(--c) 80%, var(--ink)); flex: none; }
.m-split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 20px; flex: 1; min-height: 0; }
.lead { position: relative; display: flex; flex-direction: column; gap: 6px; min-width: 0; min-height: 0; flex: none; }
.lead .acts { top: 8px; right: 8px; transform: none; }
.lead-t { font-size: 15px; font-weight: 600; line-height: 1.35; letter-spacing: -.01em; }
.lead-t.lg { font-size: 17px; }
.reason { font-size: 13px; color: var(--ink-2); line-height: 1.5; }
.reason::before { content: "推荐理由"; font: 500 10.5px/1 var(--mono); letter-spacing: .04em; color: var(--ink-3); border: 1px solid var(--line-2); border-radius: 4px; padding: 2px 4px; margin-right: 6px; vertical-align: 1px; }
.cover { height: 132px; border-radius: 12px; overflow: hidden; background: var(--well); flex: none; position: relative; }
.cover img { width: 100%; height: 100%; object-fit: cover; }
.tile { position: relative; flex: 0 0 200px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.tile .thumb { height: 64px; }
.tile .tt { font-size: 13px; font-weight: 500; line-height: 1.35; }
.tile .acts { top: 6px; right: 6px; transform: none; }
.media-row { display: flex; gap: 10px; align-items: center; min-width: 0; position: relative; padding: 2px 0; }
.media-row .thumb { width: 88px; height: 50px; }
.media-row .tt { font-size: 13px; font-weight: 500; line-height: 1.35; }
.media-row .acts { right: 0; }
.media-row:hover .acts { display: flex; }
.tight .media-row { padding: 0; }
.w--photo { padding: 0; border-color: transparent; }
.w--photo .bgimg { position: absolute; inset: 0; z-index: 0; }
.w--photo .bgimg img { width: 100%; height: 100%; object-fit: cover; }
.w--photo .bgimg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(10, 12, 16, .82), rgba(10, 12, 16, .12) 62%, rgba(10, 12, 16, .3)); }
.w--photo .w-b { padding: 14px 16px; color: var(--on-photo); justify-content: space-between; }
.w--photo .s-lab { color: rgba(255, 255, 255, .86); }
.w--photo .meta { color: rgba(255, 255, 255, .7); }
.w--photo .w-m, .w--sky .w-m { color: rgba(255, 255, 255, .85); }
.w--photo .w-m:hover, .w--sky .w-m:hover { background: rgba(255, 255, 255, .16); color: #FFFFFF; }
.w--photo .acts { top: auto; bottom: 12px; right: 12px; transform: none; }
.w--photo:hover .acts { display: flex; }

/* calendar */
.cal-s { display: flex; align-items: center; gap: 14px; }
.cal-d { font-size: 56px; font-weight: 300; line-height: .95; color: var(--coral); letter-spacing: -.05em; font-variant-numeric: tabular-nums; }
.cal-w b { display: block; font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
.cal-w span { font-size: 13px; color: var(--ink-3); }
.ev { display: flex; gap: 10px; align-items: stretch; min-width: 0; flex: none; padding: 3px 0; }
.ev::before { content: ""; width: 3px; border-radius: 2px; background: var(--c, var(--t-calendar)); flex: none; }
.ev .ev-t { font-size: 13.5px; font-weight: 500; }
.ev .ev-h { font-size: 12.5px; color: var(--coral); font-variant-numeric: tabular-nums; }
.ev.past { opacity: .45; }
.ev .now { color: var(--ok); font-weight: 600; }
.cal-m { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 18px; flex: 1; min-height: 0; }
.cal-m .cal-s { flex-direction: column; align-items: flex-start; gap: 6px; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; flex: none; }
.day { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; border-radius: 10px; font-variant-numeric: tabular-nums; }
.day small { font-size: 11px; color: var(--ink-3); }
.day b { font-size: 15px; font-weight: 500; }
.day i { width: 4px; height: 4px; border-radius: 50%; background: var(--ink-3); opacity: 0; }
.day i.has { opacity: 1; }
.day.today { background: var(--coral); color: #FFFFFF; }
.day.today small { color: rgba(255, 255, 255, .8); }
.day.today i { background: #FFFFFF; }
.agenda-h { font: 500 11px/1 var(--mono); letter-spacing: .05em; color: var(--ink-3); padding: 8px 0 4px; flex: none; }

/* capture */
.cap { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 8px 0 14px; border-radius: 12px; background: var(--well); border: 1px solid var(--line); flex: none; }
.cap:focus-within { border-color: color-mix(in srgb, var(--accent) 45%, transparent); background: var(--card); }
.cap input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 15px; }
.cap input::placeholder { color: var(--ink-3); }
.cap-wide { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 20px; flex: 1; min-height: 0; align-items: start; }
.cap-hint { font-size: 12px; color: var(--ink-3); flex: none; }
.cap-hint code { font-family: var(--mono); color: var(--ink-2); background: var(--well); border-radius: 4px; padding: 1px 4px; }
.kind { font: 500 10.5px/1 var(--mono); padding: 3px 5px; border-radius: 4px; flex: none; text-transform: uppercase; letter-spacing: .03em; }
.kind.task { background: color-mix(in srgb, var(--t-task) 15%, var(--card)); color: color-mix(in srgb, var(--t-task) 80%, var(--ink)); }
.kind.note { background: color-mix(in srgb, var(--t-capture) 15%, var(--card)); color: color-mix(in srgb, var(--t-capture) 80%, var(--ink)); }

/* bookmarks */
.bm-s { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 6px; align-content: center; flex: 1; }
.bm-tile { display: flex; flex-direction: column; align-items: center; gap: 5px; min-width: 0; border-radius: 12px; padding: 2px 0; }
.bm-tile .mono-t { width: 44px; height: 44px; border-radius: 13px; font-size: 17px; }
.bm-tile span { font-size: 11.5px; color: var(--ink-2); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bm-tile:hover .mono-t { transform: translateY(-1px); box-shadow: var(--shadow); }
.bm-grid { display: grid; gap: 8px 12px; flex: 1; align-content: start; }
.bm-chip { display: flex; align-items: center; gap: 9px; min-width: 0; padding: 4px; border-radius: 10px; }
.bm-chip:hover { background: var(--well); }
.bm-chip .mono-t { width: 30px; height: 30px; border-radius: 9px; font-size: 13px; }
.bm-chip span { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* project */
.ring { position: relative; flex: none; }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.pj-s { display: flex; align-items: center; gap: 14px; min-width: 0; }
.w--s { container-type: inline-size; }
@container (max-width: 230px) {
  .pj-s { gap: 10px; }
  .pj-s .ring, .pj-s .ring svg { width: 46px !important; height: 46px !important; }
  .pj-s .ring b { font-size: 11px; }
  .fd { font-size: 34px; }
  .s-big { font-size: 44px; }
  .bm-s .mono-t { width: 36px; height: 36px; font-size: 15px; }
}
.pj-row { display: flex; flex-direction: column; gap: 6px; flex: none; padding: 2px 0; }
.pj-row .pj-h { display: flex; align-items: center; gap: 8px; min-width: 0; }
.pj-row .pj-h b { font-size: 13.5px; font-weight: 600; }
.pj-dot { width: 8px; height: 8px; border-radius: 3px; background: var(--c); flex: none; }
.gh { display: flex; align-items: center; gap: 10px; min-width: 0; flex: none; min-height: 30px; }
.gh .gh-i { width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; background: var(--well); color: var(--ink-2); flex: none; }
.gh .tt { font-size: 13px; }
.gh code { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); }

/* habit */
.dots7 { display: flex; gap: 5px; flex: none; }
.dots7 button, .dots7 span { width: 18px; height: 18px; border-radius: 6px; background: var(--well); border: 1px solid var(--line); display: grid; place-items: center; font-size: 9.5px; color: var(--ink-3); }
.dots7 .on { background: color-mix(in srgb, var(--t-habit) 78%, var(--card)); border-color: transparent; color: #FFFFFF; }
.dots7 .future { opacity: .45; background: transparent; border-style: dashed; }
.dots7 .today { border: 1.5px dashed color-mix(in srgb, var(--t-habit) 70%, transparent); }
.dots7 .today.on { border: 0; }
.hb-row { display: flex; align-items: center; gap: 12px; min-width: 0; flex: none; min-height: 34px; }

/* focus */
.fd { font-size: 44px; font-weight: 300; letter-spacing: -.04em; font-variant-numeric: tabular-nums; line-height: 1; }
.fx { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.play-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; flex: none; box-shadow: var(--shadow); }
.play-btn.ghost { background: var(--well); color: var(--ink-2); box-shadow: none; }
.fm { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 20px; align-items: center; flex: 1; min-height: 0; }
.fm .ring b { font-size: 20px; font-weight: 400; letter-spacing: -.02em; }
.sess { display: flex; gap: 4px; }
.sess i { width: 18px; height: 6px; border-radius: 3px; background: var(--well); }
.sess i.on { background: var(--t-focus); }

/* weather */
.w--sky { background: linear-gradient(165deg, var(--sky-1), var(--sky-2)); border-color: transparent; color: var(--on-photo); }
.w--sky .meta { color: rgba(255, 255, 255, .72); }
.wx-t { font-size: 52px; font-weight: 300; line-height: 1; letter-spacing: -.05em; }
.wx-c { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 6px; margin-top: 4px; }
.wx-b { display: flex; align-items: center; gap: 8px; font-size: 13px; color: rgba(255, 255, 255, .88); }
.wx-m { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 20px; flex: 1; min-height: 0; }
.clk { display: flex; align-items: baseline; gap: 10px; padding: 7px 0; border-top: 1px solid rgba(255, 255, 255, .16); min-width: 0; }
.clk:first-child { border-top: 0; }
.clk b { font-size: 20px; font-weight: 400; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.clk span { font-size: 13px; }
.clk small { margin-left: auto; font-size: 12px; color: rgba(255, 255, 255, .66); white-space: nowrap; }

/* states */
.sk { background: var(--skel); border-radius: 8px; position: relative; overflow: hidden; flex: none; }
.sk::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--card) 70%, transparent), transparent); animation: shimmer 1.3s infinite; }
@keyframes shimmer { to { transform: translateX(100%); } }
.state { display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 8px; flex: 1; min-height: 0; }
.state p { margin: 0; font-size: 13.5px; color: var(--ink-2); max-width: 30em; }
.state.err p { color: var(--ink); }
.state .err-i { color: var(--bad); }
.state-ill { display: flex; align-items: center; gap: 16px; flex: 1; min-height: 0; }
.state-ill img { width: 84px; height: 84px; flex: none; }
.soon { display: grid; place-items: center; flex: 1; border: 1.5px dashed var(--line-2); border-radius: 12px; color: var(--ink-3); font-size: 13px; text-align: center; padding: 12px; }

/* edit mode */
.frame.editing .w { cursor: grab; outline: 1.5px dashed color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: -1px; }
.frame.editing .w-b, .frame.editing .deco, .frame.editing .bgimg { pointer-events: none; }
.frame.editing .w-b { opacity: .55; }
.frame.editing .w-m { display: none; }
.e-bar { position: absolute; top: 8px; right: 8px; z-index: 5; display: none; gap: 3px; padding: 3px; background: var(--card); border: 1px solid var(--line-2); border-radius: 10px; box-shadow: var(--shadow-hover); color: var(--ink); }
.frame.editing .e-bar { display: flex; }
.e-bar button { min-width: 26px; height: 24px; padding: 0 5px; border-radius: 7px; font: 500 11.5px/1 var(--mono); color: var(--ink-2); display: grid; place-items: center; }
.e-bar button:hover { background: var(--well); color: var(--ink); }
.e-bar button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.e-bar .sep { width: 1px; background: var(--line-2); margin: 3px 2px; }
.e-bar .del:hover { color: var(--bad); }
.e-rz { position: absolute; right: 3px; bottom: 3px; width: 24px; height: 24px; z-index: 5; display: none; place-items: center; cursor: nwse-resize; color: var(--accent-ink); border-radius: 7px; background: var(--card); box-shadow: var(--shadow); touch-action: none; }
.frame.editing .e-rz { display: grid; }
.w.is-ph { background: color-mix(in srgb, var(--accent) 6%, transparent); box-shadow: none; border: 1.5px dashed color-mix(in srgb, var(--accent) 60%, transparent); outline: 0 !important; }
.w.is-ph > * { visibility: hidden; }
.ghost { position: fixed; z-index: 60; pointer-events: none; margin: 0; box-shadow: var(--shadow-lift) !important; transform: rotate(1.2deg) scale(1.02); outline: 0 !important; }
.ghost .w-b { opacity: 1 !important; }
.grid-empty { grid-column: 1 / -1; grid-row: span 4; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; border: 1.5px dashed var(--line-2); border-radius: var(--radius); color: var(--ink-2); text-align: center; padding: 24px; }
.grid-empty img { width: 96px; height: 96px; }
.grid-empty .row-btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }

/* popover, modal, toast */
.pop { position: fixed; z-index: 55; min-width: 216px; background: var(--card); border: 1px solid var(--line); border-radius: 13px; box-shadow: var(--shadow-lift); padding: 6px; }
.pop-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 6px 10px 4px; font-size: 12px; font-weight: 600; color: var(--ink-2); }
.pop .sizes { display: flex; gap: 4px; padding: 4px 10px 8px; }
.sz { min-width: 38px; height: 28px; padding: 0 6px; border-radius: 8px; border: 1px solid var(--line-2); font: 500 12px/1 var(--mono); color: var(--ink-2); }
.sz:hover:not([disabled]) { border-color: var(--ink-3); color: var(--ink); }
.sz[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.sz[disabled] { opacity: .3; cursor: not-allowed; }
.pop hr { border: 0; height: 1px; background: var(--line); margin: 4px 0; }
.mi { display: flex; width: 100%; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; text-align: left; font-size: 13.5px; }
.mi:hover { background: var(--well); }
.mi.danger { color: var(--bad); }
.mi input { flex: 1; min-width: 0; height: 32px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--well); padding: 0 10px; outline: 0; }
.scrim { position: fixed; inset: 0; z-index: 70; background: var(--scrim); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); animation: fade .16s ease; }
@keyframes fade { from { opacity: 0; } }
.sheet { width: min(1000px, 100%); max-height: min(740px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow-lift); display: flex; flex-direction: column; overflow: hidden; animation: rise .22s cubic-bezier(.2, .8, .2, 1); }
.sheet.sm { width: min(520px, 100%); }
@keyframes rise { from { transform: translateY(10px) scale(.985); opacity: 0; } }
.sh-h { display: flex; align-items: center; gap: 12px; padding: 18px 20px 14px; border-bottom: 1px solid var(--line); flex: none; }
.sh-h h2 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -.01em; flex: 1; min-width: 0; }
.sh-b { padding: 18px 20px; overflow: auto; display: flex; flex-direction: column; gap: 16px; min-height: 0; }
.sh-f { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--line); flex: none; }
.fld { display: flex; flex-direction: column; gap: 8px; }
.fld > span { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.fld input[type="text"], .fld textarea { height: 38px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--well); padding: 0 12px; outline: 0; }
.fld textarea { height: auto; min-height: 78px; padding: 10px 12px; resize: vertical; line-height: 1.5; font: inherit; color: inherit; }
.fld input:focus, .fld textarea:focus { border-color: color-mix(in srgb, var(--accent) 50%, transparent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chipbtn { height: 30px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--line-2); font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.chipbtn[aria-pressed="true"] { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 40%, transparent); color: var(--accent-ink); }
.seg.sm button { padding: 5px 10px; font-size: 13px; }
.gal { display: grid; grid-template-columns: 300px minmax(0, 1fr); flex: 1; min-height: 0; }
.gal-l { border-right: 1px solid var(--line); overflow: auto; padding: 10px; display: flex; flex-direction: column; gap: 2px; }
.gal-l h3 { margin: 10px 10px 6px; font: 500 11px/1 var(--mono); letter-spacing: .06em; color: var(--ink-3); }
.gal-it { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 12px; text-align: left; width: 100%; }
.gal-it:hover { background: var(--well); }
.gal-it[aria-pressed="true"] { background: var(--accent-soft); }
.gal-it b { display: block; font-size: 14px; font-weight: 600; }
.gal-it small { display: block; font-size: 12px; color: var(--ink-3); }
.gal-it .soon-b { margin-left: auto; font: 500 10px/1 var(--mono); color: var(--ink-3); border: 1px solid var(--line-2); border-radius: 4px; padding: 3px 4px; }
.gal-r { overflow: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.pv { background: var(--bg); border-radius: 18px; height: 290px; overflow: hidden; flex: none; position: relative; }
.pv-in { position: absolute; left: 50%; top: calc(50% - 8px); transform-origin: center; }
.pv .w { cursor: default; }
.pv-cap { position: absolute; left: 14px; bottom: 12px; font: 11px var(--mono); color: var(--ink-3); }
.gal-meta { display: flex; flex-wrap: wrap; gap: 16px 28px; }
.gal-acts { font-size: 12.5px; color: var(--ink-2); }
.gal-acts b { color: var(--ink); font-weight: 600; }
@media (max-width: 760px) {
  .gal { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
  .gal-l { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); }
  .gal-l h3 { display: none; }
  .gal-it { flex: 0 0 auto; width: auto; }
  .gal-it small, .gal-it .soon-b { display: none; }
  .pv { height: 240px; }
}
.plan { display: grid; grid-template-columns: repeat(12, 1fr); grid-auto-rows: 26px; gap: 5px; background: var(--bg); border-radius: 14px; padding: 12px; }
.plan div { background: var(--card); border: 1px solid var(--line); border-radius: 8px; display: flex; align-items: center; gap: 6px; padding: 0 8px; font-size: 12px; font-weight: 500; overflow: hidden; white-space: nowrap; animation: rise .3s both; }
.perm { display: grid; gap: 8px; font-size: 13px; color: var(--ink-2); background: var(--well); border-radius: 12px; padding: 12px 14px; }
.perm b { color: var(--ink); font-weight: 600; }
.perm .row-p { display: flex; gap: 10px; }
.perm .row-p span:first-child { flex: 0 0 44px; font: 500 11px/1.6 var(--mono); color: var(--ink-3); }
.thinking { display: flex; align-items: center; gap: 10px; color: var(--ink-2); font-size: 13px; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 80; background: var(--ink); color: var(--bg); border-radius: 12px; padding: 10px 12px 10px 16px; display: flex; align-items: center; gap: 14px; font-size: 13px; box-shadow: var(--shadow-lift); max-width: calc(100vw - 32px); animation: rise .2s ease; }
.toast button { font-weight: 600; color: var(--bg); text-decoration: underline; text-underline-offset: 3px; padding: 2px 4px; }

/* prototype controls: deliberately not product UI */
.proto { position: fixed; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 65; }
.proto-fab { height: 36px; padding: 0 14px; border-radius: 99px; background: var(--ink); color: var(--bg); font: 500 12px/1 var(--mono); box-shadow: var(--shadow-lift); display: flex; align-items: center; gap: 8px; }
.proto-panel { position: absolute; right: 0; bottom: 46px; width: min(320px, calc(100vw - 32px)); max-height: calc(100vh - 120px); overflow: auto; background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow-lift); padding: 14px; display: grid; gap: 14px; }
.pg > span { display: block; font: 500 11px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 7px; }
.pg .opts { display: flex; flex-wrap: wrap; gap: 4px; }

function layoutOf(board, cols) {
  const L = (state.layouts[board] ||= { 12: [] });
  if (!L[cols]) L[cols] = L[12].map((x) => ({ ...x }));
  return L[cols];
}
function pack(list, cols) {
  const occ = [];
  const pos = {};
  const free = (x, y, w, h) => { for (let r = y; r < y + h; r++) for (let c = x; c < x + w; c++) if (occ[r]?.[c]) return false; return true; };
  for (const it of list) {
    const [w, h] = footprint(state.widgets[it.id].type, it.size, cols);
    for (let y = 0; ; y++) {
      let placed = false;
      for (let x = 0; x <= cols - w; x++) {
        if (free(x, y, w, h)) {
          for (let r = y; r < y + h; r++) { occ[r] ||= []; for (let c = x; c < x + w; c++) occ[r][c] = 1; }
          pos[it.id] = { x, y, w, h }; placed = true; break;
        }
      }
      if (placed) break;
    }
  }
  return pos;
}

function evState(ev) {
  if (ev.d !== 0) return '';
  const now = new Date(); const hm = pad2(now.getHours()) + ':' + pad2(now.getMinutes());

  if (hm >= ev.s) return 'now';
  return '';
}

const nextEvent = () => EVENTS.find((e) => e.d === 0 && evState(e) !== 'past') || null;

function fit(root) {

    while (guard-- > 0 && el.children.length > 1 && over()) el.lastElementChild.remove();
    while (el.children.length > 1 && el.lastElementChild.classList.contains('agenda-h')) el.lastElementChild.remove();
  }

// ---------- grid rendering + FLIP ----------
function flip(mutate, skip) {
  if (reduceMotion) { mutate(); return; }
  const before = new Map([...grid.children].map((el) => [el, el.getBoundingClientRect()]));
  mutate();
  for (const el of grid.children) {
    if (el === skip) continue;
    const a = before.get(el);
    const b = el.getBoundingClientRect();
    if (!a) { el.animate([{ opacity: 0, transform: 'scale(.96)' }, { opacity: 1, transform: 'none' }], { duration: 260, easing: 'cubic-bezier(.2,.8,.2,1)' }); continue; }
    const dx = a.left - b.left; const dy = a.top - b.top;
    if (Math.abs(dx) > 1 || Math.abs(dy) > 1) el.animate([{ transform: `translate(${dx}px,${dy}px)` }, { transform: 'none' }], { duration: 260, easing: 'cubic-bezier(.2,.8,.2,1)' });
    if (Math.abs(a.width - b.width) > 1 || Math.abs(a.height - b.height) > 1) el.animate([{ opacity: .4 }, { opacity: 1 }], { duration: 220, easing: 'ease-out' });
  }
}
function renderWidget(id) {
  const el = grid.querySelector(`[data-id="${id}"]`);
  const w = state.widgets[id];
  if (!el || !w) return;
  const keepFocus = document.activeElement && el.contains(document.activeElement) && document.activeElement.id;
  const { cls, html } = cardInner(w, el.dataset.size, state.cols);
  el.className = cls + (el.classList.contains('is-ph') ? ' is-ph' : '');
  el.innerHTML = html;
  fit(el);
  if (keepFocus) { const f = document.getElementById(keepFocus); if (f) f.focus(); }
}
function renderGrid(animate = true) {
  const cols = state.cols;
  grid.style.setProperty('--cols', cols);
  const list = layoutOf(state.active, cols);
  $('.grid-empty', grid)?.remove();
  const pos = pack(list, cols);
  const apply = () => {
    const keep = new Set(list.map((l) => l.id));
    for (const el of [...grid.children]) if (!keep.has(el.dataset.id)) el.remove();
    list.forEach((l) => {
      let el = grid.querySelector(`[data-id="${l.id}"]`);
      const fresh = !el;
      if (fresh) { el = document.createElement('section'); el.dataset.id = l.id; grid.appendChild(el); }
      const p = pos[l.id];
      el.style.gridColumn = `${p.x + 1} / span ${p.w}`;
      el.style.gridRow = `${p.y + 1} / span ${p.h}`;
      if (fresh || el.dataset.size !== l.size || el.dataset.cols !== String(cols)) { el.dataset.size = l.size; el.dataset.cols = cols; renderWidget(l.id); }
    });
    const order = [...grid.children].map((e) => e.dataset.id).join();
    if (order !== list.map((l) => l.id).join()) list.forEach((l) => grid.appendChild(grid.querySelector(`[data-id="${l.id}"]`)));
  };
  animate ? flip(apply, dragging?.el) : apply();
  if (!list.length) grid.insertAdjacentHTML('beforeend', `<div class="grid-empty"><img data-asset="agent" src="${asset('agent')}" alt="" onerror="this.remove()"><div><b style="font-size:16px;color:var(--ink)">这个 Board 还是空的</b><div class="meta" style="margin-top:4px;white-space:normal">从 Widget 库里挑几个，或者告诉 Agent 你想要什么样的 Board。</div></div><div class="row-btns"><button class="btn btn-ink" data-act="gallery-open">${I.plus}添加 Widget</button><button class="btn" data-act="agent-open">让 Agent 搭一个</button></div></div>`);
}

      { g: '前往 Board' }, ...state.boards.map((b) => ({ k: 'go', t: b.name, run: () => switchBoard(b.id) })));

  }
  if (['todo', 't', 'task'].includes(head)) { out.push({ g: '新建' }, rest ? { k: '↵', t: `新建任务「<b>${esc(rest)}</b>」→ 收件箱`, run: () => capture(rest) } : { k: '…', t: '继续输入任务内容', run: () => {}, keep: true }); return out; }

  if (head === 'rss' || head === 'feed' || head === '订阅') {
    const hits = Object.entries(SOURCES).filter(([k, v]) => !rest || (v.label + k).toLowerCase().includes(rest.toLowerCase()));
    out.push({ g: '订阅来源' }, ...hits.map(([k, v]) => ({ k: SNAP.items.filter((i) => i.sourceId === k).length + ' 条', t: `${esc(v.label)} <span class="meta">· ${v.cadence} · 添加为 Widget</span>`, run: () => galleryOpen({ type: 'subscription', sources: [k], size: 'M' }) })));
    if (!hits.length) out.push({ empty: `没有叫「${esc(rest)}」的来源。` });
    return out;
  }
  if (head === 'add' || head === 'widget') { out.push({ g: 'Widget' }, ...Object.entries(T).filter(([, v]) => !v.soon && (!rest || v.name.includes(rest))).map(([k, v]) => ({ k: v.pri, t: `添加「${esc(v.name)}」`, run: () => galleryOpen({ type: k }) }))); return out; }
  if (head === 'agent') { out.push({ g: 'Agent' }, { k: '↵', t: rest ? `让 Agent：${esc(rest)}` : '描述你想要的 Board', run: () => agentOpen(rest) }); return out; }
  const ql = s.toLowerCase();
  const boards = state.boards.filter((b) => b.name.includes(s));
  const tasks = state.tasks.filter((t) => t.title.toLowerCase().includes(ql)).slice(0, 4);
  const items = SNAP.items.filter((i) => i.title.toLowerCase().includes(ql)).slice(0, 5);
  if (boards.length) out.push({ g: 'Board' }, ...boards.map((b) => ({ k: 'go', t: esc(b.name), run: () => switchBoard(b.id) })));
  if (tasks.length) out.push({ g: '任务' }, ...tasks.map((t) => ({ k: t.done ? '✓' : t.list === 'today' ? '今天' : t.list === 'inbox' ? '收件箱' : '之后', t: esc(t.title), run: () => { t.done = !t.done; refreshTypes(['task', 'project']); toast(t.done ? '已完成' : '已标记为未完成'); } })));
  if (items.length) out.push({ g: '订阅内容' }, ...items.map((i) => ({ k: SOURCES[i.sourceId]?.short, t: esc(i.title), href: safeUrl(i.url) })));
  out.push({ g: '新建' }, { k: 'todo', t: `新建任务「<b>${esc(s)}</b>」`, run: () => capture(s) });
  return out;
}
function setCmd(v) { const inp = $('#cmd-in'); inp.value = v; inp.focus(); renderCmd(); }
function renderCmd() {
  const inp = $('#cmd-in'); const pop = $('#cmd-pop');
  if (!cmd.open) { pop.hidden = true; inp.setAttribute('aria-expanded', 'false'); return; }
  cmd.items = cmdCompute(inp.value);
  const sel = cmd.items.filter((x) => x.run || x.href);
  cmd.sel = Math.min(cmd.sel, Math.max(0, sel.length - 1));
  let n = -1;
  pop.innerHTML = cmd.items.map((x) => {
    if (x.g) return `<div class="cmd-group">${x.g}</div>`;
    if (x.empty) return `<div class="cmd-empty">${x.empty}</div>`;
    n++;
    const inner = `<span class="k">${esc(x.k || '')}</span><span class="ci-t c1">${x.t}</span>${x.d ? `<span class="meta">${esc(x.d)}</span>` : ''}`;
    return x.href ? `<a class="cmd-item" role="option" aria-selected="${n === cmd.sel}" data-ci="${n}" href="${esc(x.href)}" target="_blank" rel="noopener noreferrer">${inner}</a>` : `<button class="cmd-item" role="option" aria-selected="${n === cmd.sel}" data-ci="${n}">${inner}</button>`;
  }).join('');
  pop.hidden = false; inp.setAttribute('aria-expanded', 'true');
}
function runCmd(i) {
  const sel = cmd.items.filter((x) => x.run || x.href); const x = sel[i]; if (!x) return;
  if (x.href) { window.open(x.href, '_blank', 'noopener'); return; }
  x.run();
  if (!x.keep) { $('#cmd-in').value = ''; cmd.open = false; renderCmd(); $('#cmd-in').blur(); }
}

// ---------- boards ----------
function switchBoard(id) { if (id === state.active) return; state.active = id; renderBoard(); }
function newBoardPop(anchor) {
  const p = openPop(anchor, `<div class="pop-h">新建 Board</div><form class="mi" data-form="board-new" style="cursor:default"><input id="nb-in" placeholder="例如：科研、旅行" autocomplete="off" aria-label="Board 名称"><button class="btn btn-ink" style="height:32px">创建</button></form><div class="meta" style="padding:2px 10px 8px;white-space:normal">新 Board 是空的，和其它 Board 共用同一份任务和订阅。</div>`);
  setTimeout(() => $('#nb-in', p)?.focus(), 20);
}

// ---------- drag + resize ----------
let dragging = null;
function colMetrics() {
  const cs = getComputedStyle(grid); const gap = parseFloat(cs.columnGap) || 14;
  const colW = (grid.clientWidth - gap * (state.cols - 1)) / state.cols;
  return { gap, colW, row: parseFloat(cs.gridAutoRows) || 88 };
}
grid = null;
function onPointerDown(e) {
  if (!state.edit || e.button !== 0) return;
  const rz = e.target.closest('[data-rz]');
  const card = e.target.closest('#grid > section.w');
  if (!card || e.target.closest('.e-bar')) return;
  e.preventDefault();
  if (rz) return startResize(e, card);
  const start = { x: e.clientX, y: e.clientY };
  const r = card.getBoundingClientRect();
  dragging = { el: card, id: card.dataset.id, start, off: { x: e.clientX - r.left, y: e.clientY - r.top }, ghost: null, lockUntil: 0 };
  const move = (ev) => {
    if (!dragging) return;
    if (!dragging.ghost) {
      if (Math.hypot(ev.clientX - start.x, ev.clientY - start.y) < 5) return;
      const g = card.cloneNode(true); g.classList.add('ghost'); g.style.width = r.width + 'px'; g.style.height = r.height + 'px'; g.style.gridColumn = g.style.gridRow = '';
      document.body.appendChild(g); dragging.ghost = g; card.classList.add('is-ph');
    }
    dragging.ghost.style.left = ev.clientX - dragging.off.x + 'px'; dragging.ghost.style.top = ev.clientY - dragging.off.y + 'px';
    if (performance.now() < dragging.lockUntil) return;
    const over = document.elementsFromPoint(ev.clientX, ev.clientY).find((x) => x.matches?.('#grid > section.w') && x !== card);
    if (!over) return;
    const orr = over.getBoundingClientRect();
    const inX = (ev.clientX - orr.left) / orr.width; const inY = (ev.clientY - orr.top) / orr.height;
    if (inX < 0.15 || inX > 0.85 || inY < 0.15 || inY > 0.85) return;
    const list = curList(); const from = list.findIndex((l) => l.id === dragging.id); const to = list.findIndex((l) => l.id === over.dataset.id);
    if (from < 0 || to < 0 || from === to) return;
    const [it] = list.splice(from, 1); list.splice(to, 0, it);
    dragging.lockUntil = performance.now() + 280;
    renderGrid(true);
  };
  const up = () => {
    removeEventListener('pointermove', move); removeEventListener('pointerup', up); removeEventListener('pointercancel', up);
    const d = dragging; dragging = null; if (!d) return;
    if (d.ghost) {
      const to = d.el.getBoundingClientRect(); const from = d.ghost.getBoundingClientRect();
      const done = () => { d.ghost.remove(); d.el.classList.remove('is-ph'); };
      if (reduceMotion) done(); else d.ghost.animate([{ left: from.left + 'px', top: from.top + 'px', transform: 'rotate(1.2deg) scale(1.02)' }, { left: to.left + 'px', top: to.top + 'px', transform: 'none' }], { duration: 200, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'forwards' }).onfinish = done;
    }
  };
  addEventListener('pointermove', move); addEventListener('pointerup', up); addEventListener('pointercancel', up);
}
function startResize(e, card) {
  const id = card.dataset.id; const w = state.widgets[id];
  const r = card.getBoundingClientRect(); const m = colMetrics();
  const move = (ev) => {
    const cw = (ev.clientX - r.left + m.gap / 2) / (m.colW + m.gap); const ch = (ev.clientY - r.top + m.gap / 2) / (m.row + m.gap);
    let best = null; let bd = Infinity;
    for (const s of Object.keys(T[w.type].sizes)) { const [fw, fh] = footprint(w.type, s, state.cols); const dd = (fw - cw) ** 2 + (fh - ch) ** 2 * 1.4; if (dd < bd) { bd = dd; best = s; } }
    if (best) setSize(id, best);
  };
  const up = () => { removeEventListener('pointermove', move); removeEventListener('pointerup', up); };
  addEventListener('pointermove', move); addEventListener('pointerup', up);
}

// ---------- events ----------
document.addEventListener('click', (e) => {
  const a = e.target.closest('[data-act]');
  if (!e.target.closest('.pop') && !e.target.closest('[data-act="w-menu"]') && !e.target.closest('[data-act="board-new"]')) closePop();
  if (!e.target.closest('#cmd') && cmd.open) { cmd.open = false; renderCmd(); }
  const ci = e.target.closest('[data-ci]');
  if (ci && !ci.href) { runCmd(Number(ci.dataset.ci)); return; }
  if (!a) return;
  const act = a.dataset.act; const ds = a.dataset;
  switch (act) {
    case 'scrim': if (e.target === a) closeModal(); break;
    case 'modal-close': closeModal(); break;
    case 'board': switchBoard(ds.board); break;
    case 'board-new': newBoardPop(a); break;
    case 'edit-toggle':
      state.edit = !state.edit; frame.classList.toggle('editing', state.edit); $('#edit-sw').setAttribute('aria-checked', state.edit); renderEditbar();
      if (state.edit && !reduceMotion) $$('#grid > section.w').forEach((el, i) => el.animate([{ transform: 'scale(1)' }, { transform: 'scale(.985)' }, { transform: 'scale(1)' }], { duration: 320, delay: i * 18 }));
      break;
    case 'gallery-open': closePop(); galleryOpen(); break;
    case 'agent-open': agentOpen(); break;
    case 'agent-plan': agentPlan(); break;
    case 'agent-apply': agentApply(); break;
    case 'theme-toggle': {
      const dark = prefs.theme === 'dark' || (prefs.theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      prefs.theme = dark ? 'light' : 'dark'; store.set('theme', prefs.theme); applyPrefs(); renderProto(); break;
    }
    case 'task-toggle': { const t = state.tasks.find((x) => x.id === ds.task); if (t) { t.done = !t.done; refreshTypes(['task', 'project', 'focus']); } break; }
    case 'task-today': { const t = state.tasks.find((x) => x.id === ds.task); if (t) { t.list = 'today'; refreshTypes(['task', 'capture']); toast('已移到今天'); } break; }
    case 'item-later': toggleLater(ds.item); break;
    case 'item-task': itemToTask(ds.item); break;
    case 'rl-note': { const it = itemById.get(ds.item); if (it) { state.notes.unshift({ id: uid('n'), text: it.title, at: '刚刚', origin: originOf(it) }); state.captures.unshift({ kind: 'note', text: it.title, at: '刚刚' }); toast(`已转为 Note · 出处：${originOf(it).source}`); refreshTypes(['capture']); } break; }
    case 'habit-tick': { const h = state.habits.find((x) => x.id === ds.habit); if (h) { const i = dayIdx(); h.week[i] = h.week[i] ? 0 : 1; h.streak += h.week[i] ? 1 : -1; refreshTypes(['habit']); } break; }
    case 'focus-toggle': state.focus.running = !state.focus.running; refreshTypes(['focus']); break;
    case 'focus-reset': Object.assign(state.focus, { running: false, left: state.focus.total }); refreshTypes(['focus']); break;
    case 'focus-next-task': { const open = state.tasks.filter((t) => t.list === 'today' && !t.done); const i = open.findIndex((t) => t.id === state.focus.task); state.focus.task = open[(i + 1) % open.length]?.id; refreshTypes(['focus']); break; }
    case 'w-menu': widgetMenu(a, ds.w); break;
    case 'w-size': closePop(); setSize(ds.w, ds.size); break;
    case 'w-dup': closePop(); dupWidget(ds.w); break;
    case 'w-remove': closePop(); removeWidget(ds.w); break;
    case 'w-refresh': closePop(); refreshWidget(ds.w); break;
    case 'w-settings': closePop(); settingsSheet(ds.w); break;
    case 'retry': refreshWidget(ds.w); if (prefs.demo === 'error') { prefs.demo = 'ok'; renderProto(); setTimeout(rerenderAll, 760); } break;
    case 'set-src': { const s = draft.settings; s.sources ||= []; s.sources = s.sources.includes(ds.v) ? s.sources.filter((x) => x !== ds.v) : [...s.sources, ds.v]; if (!s.sources.length) s.sources = [ds.v]; draft.title = $('#set-title')?.value ?? draft.title; renderSettings(); break; }
    case 'set-pres': draft.settings.pres = ds.v; draft.title = $('#set-title')?.value ?? draft.title; renderSettings(); break;
    case 'set-sort': draft.settings.sort = ds.v; draft.title = $('#set-title')?.value ?? draft.title; renderSettings(); break;
    case 'set-refresh': draft.settings.refresh = ds.v; draft.title = $('#set-title')?.value ?? draft.title; renderSettings(); break;
    case 'set-proj': draft.settings.project = ds.v || null; renderSettings(); break;
    case 'set-save': { const w = state.widgets[draft.id]; const ti = $('#set-title'); if (ti) w.title = ti.value.trim() || undefined; w.settings = draft.settings; closeModal(); renderWidget(w.id); toast('设置已保存'); break; }
    case 'g-type': gal.type = ds.v; gal.size = Object.keys(T[ds.v].sizes).includes(gal.size) ? gal.size : Object.keys(T[ds.v].sizes)[0]; renderGallery(); break;
    case 'g-size': gal.size = ds.v; renderGallery(); break;
    case 'g-src': gal.sources = gal.sources.includes(ds.v) ? (gal.sources.length > 1 ? gal.sources.filter((x) => x !== ds.v) : gal.sources) : [...gal.sources, ds.v]; gal.pres = null; renderGallery(); break;
    case 'g-pres': gal.pres = ds.v; renderGallery(); break;
    case 'g-add': { const w = galWidget(); closeModal(); addWidget(w.type, gal.size, w.settings); toast(`已添加「${T[w.type].name}」`); break; }
    case 'toast-undo': { const t = a.closest('.toast'); t?._undo?.(); t?.remove(); break; }
    case 'proto-toggle': protoOpen = !protoOpen; renderProto(); break;
    case 'proto': {
      prefs[ds.k] = ds.v; if (['icon', 'nav', 'theme'].includes(ds.k)) store.set(ds.k, ds.v);
      applyPrefs(); renderProto();
      if (ds.k === 'demo') rerenderAll();
      if (ds.k === 'width' || ds.k === 'nav') requestAnimationFrame(onResize);
      break;
    }
    case 'proto-reset': state = freshState(); state.cols = colsFor(); state.edit = false; frame.classList.remove('editing'); $('#edit-sw').setAttribute('aria-checked', 'false'); renderBoard(); toast('示例数据已重置'); break;
    default: break;
  }
});
document.addEventListener('submit', (e) => {
  const f = e.target.closest('[data-form]'); if (!f) return;
  e.preventDefault();
  const inp = f.querySelector('input'); const v = inp.value.trim();
  if (f.dataset.form === 'capture') { capture(v); inp.value = ''; setTimeout(() => document.getElementById(inp.id)?.focus(), 0); }
  if (f.dataset.form === 'task-add' && v) { state.tasks.push({ id: uid('t'), title: v, list: 'today', project: null, done: false }); inp.value = ''; refreshTypes(['task', 'project']); setTimeout(() => document.getElementById(inp.id)?.focus(), 0); }
  if (f.dataset.form === 'board-new' && v) { const id = uid('b'); state.boards.push({ id, name: v, icon: 'board' }); state.layouts[id] = { 12: [] }; closePop(); state.active = id; renderBoard(); toast(`已新建 Board「${v}」`); }
});
document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('#cmd-in').focus(); return; }
  if (e.key === '/' && !/INPUT|TEXTAREA/.test(document.activeElement?.tagName)) { e.preventDefault(); $('#cmd-in').focus(); return; }
  if (e.key === 'Escape') { if ($('.pop')) closePop(); else if (modal) closeModal(); else if (cmd.open) { cmd.open = false; renderCmd(); $('#cmd-in').blur(); } else if (state.edit) $('#edit-sw').click(); }
  if (document.activeElement?.id === 'cmd-in' && cmd.open) {
    const n = cmd.items.filter((x) => x.run || x.href).length;
    if (e.key === 'ArrowDown') { e.preventDefault(); cmd.sel = (cmd.sel + 1) % Math.max(1, n); renderCmd(); }
    if (e.key === 'ArrowUp') { e.preventDefault(); cmd.sel = (cmd.sel - 1 + n) % Math.max(1, n); renderCmd(); }
    if (e.key === 'Enter') { e.preventDefault(); runCmd(cmd.sel); }
  }
});
document.addEventListener('focusin', (e) => { if (e.target.id === 'cmd-in') { cmd.open = true; cmd.sel = 0; renderCmd(); } });
document.addEventListener('input', (e) => { if (e.target.id === 'cmd-in') { cmd.open = true; cmd.sel = 0; renderCmd(); } });
document.addEventListener('pointerdown', onPointerDown);
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', applyPrefs);

// ---------- responsive columns ----------
function colsFor() { const w = grid.clientWidth; return w >= 940 ? 12 : w >= 540 ? 6 : 4; }
let lastW = 0; let rT;
function onResize() {
  const c = colsFor();
  if (c !== state.cols) { state.cols = c; renderEditbar(); renderGrid(false); rerenderAll(); lastW = grid.clientWidth; return; }
  if (Math.abs(grid.clientWidth - lastW) > 2) { lastW = grid.clientWidth; clearTimeout(rT); rT = setTimeout(rerenderAll, 90); }
}

// ---------- boot ----------
state = freshState();
frame.innerHTML = shellHTML();
grid = $('#grid');
applyPrefs();
state.cols = colsFor();
lastW = grid.clientWidth;
renderBoard(false);
renderProto();
new ResizeObserver(() => onResize()).observe(grid);
window.__sooyo = { get state() { return state; }, rerenderAll };
})();
