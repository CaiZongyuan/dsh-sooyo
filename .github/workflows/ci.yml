name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ startsWith(github.ref, 'refs/tags/') && 30 || 10 }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck

      - run: pnpm run build

      - run: pnpm run check

      - run: pnpm run test:offline

      - name: Prepare real DSH release smoke
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          npm install --prefix "$RUNNER_TEMP/sooyo-dsh" --no-save --package-lock=false @deepseek-ai/dsh@0.2.2-rc.1
          pnpm exec playwright install --with-deps chromium

      - name: Real package, UI, sync and hot upgrade smoke
        if: startsWith(github.ref, 'refs/tags/')
        env:
          DSH_E2E_BIN: ${{ runner.temp }}/sooyo-dsh/node_modules/@deepseek-ai/dsh/lib/bin.js
        run: pnpm run test:e2e

      - name: Pack and validate official release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          pnpm pack --pack-destination artifacts
          pnpm run release:verify

      - name: Save release package and visual evidence
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: sooyo-release
          path: |
            artifacts/*.tgz
            test-results/screenshots/

      - name: Publish through npm trusted publishing
        if: startsWith(github.ref, 'refs/tags/')
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/sooyo-publish.npmrc"
            printf '%s\n' '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' > "$NPM_CONFIG_USERCONFIG"
          fi
          node dev/publish-release.mjs
